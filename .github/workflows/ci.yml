name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-debug, cc: gcc, cxx: g++, preset: debug }
          - { name: linux-gcc-release, cc: gcc, cxx: g++, preset: release }
          - { name: linux-clang-debug, cc: clang, cxx: clang++, preset: debug }
          - { name: linux-clang-release, cc: clang, cxx: clang++, preset: release }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMYMALLOC_WARNINGS_AS_ERRORS=ON
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  build-and-test-windows:
    name: windows-msvc-${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMYMALLOC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: sanitizers-asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset asan-ubsan -DMYMALLOC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset asan-ubsan --parallel
      - name: Test
        run: ctest --preset asan-ubsan

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pipx install clang-format==23.1.3
      - name: Check formatting
        run: python3 scripts/check_format.py

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Configure
        run: cmake --preset release
      - name: Run cppcheck
        run: >-
          cppcheck
          --project=out/build/release/compile_commands.json
          --enable=warning,performance,portability
          --error-exitcode=1
          --inline-suppr
          --suppress=missingIncludeSystem
          --std=c++20