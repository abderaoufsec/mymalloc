name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository contents.
permissions:
  contents: read

# A new push to the same branch supersedes an in-flight run, so a rapid series
# of commits does not leave stale jobs competing for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-debug, cc: gcc, cxx: g++, preset: debug }
          - { name: linux-gcc-release, cc: gcc, cxx: g++, preset: release }
          - { name: linux-clang-debug, cc: clang, cxx: clang++, preset: debug }
          - { name: linux-clang-release, cc: clang, cxx: clang++, preset: release }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMYMALLOC_WARNINGS_AS_ERRORS=ON
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: out/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  build-and-test-windows:
    name: windows-msvc-${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMYMALLOC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-windows-msvc-${{ matrix.preset }}
          path: out/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitizers:
    name: sanitizers-asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset asan-ubsan -DMYMALLOC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset asan-ubsan --parallel
      - name: Test
        run: ctest --preset asan-ubsan
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-sanitizers-asan-ubsan
          path: out/build/asan-ubsan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  thread-sanitizer:
    name: sanitizers-tsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset tsan -DMYMALLOC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset tsan --parallel
      - name: Test
        run: ctest --preset tsan
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-sanitizers-tsan
          path: out/build/tsan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pipx install clang-format==23.1.3
      - name: Check formatting
        run: python3 scripts/check_format.py

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Configure
        run: cmake --preset release
      - name: Run cppcheck
        run: >-
          cppcheck
          --project=out/build/release/compile_commands.json
          --enable=warning,performance,portability
          --error-exitcode=1
          --inline-suppr
          --suppress=missingIncludeSystem
          --std=c++20

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin clang-tidy so the analysis is reproducible across runner image
      # changes. (clang-format and clang-tidy are separate PyPI packages; the
      # latest clang-tidy wheel is 22.1.8.)
      - name: Install clang-tidy
        run: pipx install "clang-tidy==22.1.8"
      - name: Configure
        run: cmake --preset release
      # Analyze every TU in the compilation database (library, tests, examples)
      # with the repo's .clang-tidy. The helper treats any clang-tidy finding as
      # a failure, so the tree stays clang-tidy clean. The compile database is
      # generated by the system compiler; clang-tidy reads the include flags
      # from it, so no extra system-header plumbing is needed on Linux.
      - name: Run clang-tidy
        run: >-
          python3 scripts/run_clang_tidy.py
          out/build/release/compile_commands.json
